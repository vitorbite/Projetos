<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game</title>
    <link rel="stylesheet" href="src/style.css">
</head>

<body>
    <div class="container">
        <header>
            <h1>Rock, Paper, Scissors</h1>
        </header>
            <div class="box" id="box">
                <div class="emoji" id="emoji">
                </div>
            </div>

        <p id="res">---</p>

        <h3>Select a hand:</h3>
        <div id="buttons">
            <button id="tes" onclick="Scissors()"><span>✌</span>Scissors</button>
            <button id="papel" onclick="Paper()"><span>🖐</span>Paper</button>
            <button id="pedra" onclick="Rock()"><span>✊</span>Rock</button>
            <button id="Confirm">Confirm</button>

        </div>
    </div>
    <script src="src/script.js"></script>
</body>

</html>
